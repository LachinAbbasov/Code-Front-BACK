<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./register.css">
    
    <title>Document</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Hind:wght@300;400;500;600;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <section id="register"
        style="background-image: url('https://studyhub.themewant.com/wp-content/uploads/2024/03/01-5.jpg')">
        <div class="container">
            <div class="register">
                <div class="register-left">
                    <h1>Student Registration Page</h1>

                    <div class="navigatelinks">
                        <a href="index.html">Home></a>
                        <a href="">
                            Student Registration Page</a>
                    </div>
                </div>


                <div class="register-right">
                    <img src="./images/registerimgpng.png" alt="">
                </div>

            </div>
        </div>

    </section>

    <section id="login">
        <div class="container">
            <div class="login-box">
                <h3>Hi, Welcome back!</h3>
                <input type="text" placeholder="Firstname">
                <input type="text" placeholder="Lastnime ">
                <input type="text" placeholder="Username ">
                <input type="mail" required placeholder="Email">
                <input type="password" placeholder="Password">
                <input type="password" placeholder="Password Confirmation">
                <div class="accept">
                    <div class="accept-link">
                        <div class="accept-link-left">
                            <input type="checkbox" id="terms" name="terms">
                            <label for="terms"> Keep me signed in</label>
                        </div>
                        <div class="accept-link-right">
                            <a href="">Forgot?</a>
                        </div>
                    </div>
                    <button type="submit">Sign up</button>
                    <p class="login-link">Do you have account? <a href="login.html" class="hover">Login now</a></p>
                </div>


            </div>
        </div>

    </section>
    <section id="wiew-course"> 
        <div class="container">
            <div class="wiew-course">
                <img src="./images/women-1.png" alt="">
                <p>Skills Certificate From
                    the Studyhub</p>
                <div class="btn">
                     <button>Wiew All course <i class="bi bi-arrow-right"></i> </button>
                </div>
               
            </div>
        </div>

    </section>


</body>

</html>
