<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- font link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Mysuru:wght@300;400;500;600;700&family=Manrope:wght@200..800&family=Quicksand:wght@300..700&family=Sacramento&display=swap" rel="stylesheet">
    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- css -->
    <link rel="stylesheet" href="./adminDashboard.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <section id="admin-dashboard">
        <div class="dashboard-header">
            <span>
                <span class="exclamation-icon">
                    <i class="fa-solid fa-exclamation"></i>
                </span>
                <span class="exclamation-text">Set Your Profile Photo</span>
            </span>
            <button class="exclamation-button">Click Here</button>
        </div>
        <div class="dashboard-title">
            Dashboard
        </div>
        <div class="dashboard-cards">
            <!-- 1 -->
            <div class="dashboard-card">
                <div class="card-icon"><i class="fa-solid fa-book-open"></i></div>
                <div class="card-number">0</div>
                <div class="card-name">Enrolled Courses</div>
            </div>
            <!-- 2 -->
            <div class="dashboard-card">
                <div class="card-icon"><i class="fa-solid fa-graduation-cap"></i></div>
                <div class="card-number">0</div>
                <div class="card-name">Active Courses</div>                
            </div>
            <!-- 3 -->
            <div class="dashboard-card">
                <div class="card-icon"><i class="fa-solid fa-trophy"></i></div>
                <div class="card-number">0</div>
                <div class="card-name">Completed Courses</div>
            </div>
        </div>
    </section>
    
</body>
</html>
