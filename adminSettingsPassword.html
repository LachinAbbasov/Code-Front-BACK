<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- font link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Mysuru:wght@300;400;500;600;700&family=Manrope:wght@200..800&family=Quicksand:wght@300..700&family=Sacramento&display=swap" rel="stylesheet">
    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- css -->
    <link rel="stylesheet" href="./adminSettingsPassword.css">
    <link rel="stylesheet" href="./assets/style.css">
</head>
<body>

    <section id="admin-password">
        <div class="settings-title">
            Settings
        </div>
        <div class="settings-nav">
            <span class="profile">Profile</span>
            <span class="password">Password</span>
            <span class="socialProfile">Social Profile</span>
        </div>
        <div class="password-form-wrapper">
            <form class="password-form">
                <label for="current-password">Current Password</label>
                <input type="password" id="current-password" placeholder="Current Password">
                <label for="">New Password</label>
                <input type="password" id="new-password" placeholder="Type Password">
                <label for="">Re-type New Password</label>
                <input type="password" placeholder="Type Password" id="retype-new-password">
                <button id="reset-password" type="submit">Reset Password</button>
            </form>
        </div>
    </section>
    
</body>
</html>
