<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- font link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Mysuru:wght@300;400;500;600;700&family=Manrope:wght@200..800&family=Quicksand:wght@300..700&family=Sacramento&display=swap" rel="stylesheet">
    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- css -->
    <link rel="stylesheet" href="./adminSettingsSocialProfile.css">
    <link rel="stylesheet" href="./assets/style.css">
</head>
<body>

    <section id="admin-social-profile">
        <div class="settings-title">
            Settings
        </div>
        <div class="settings-nav">
            <span class="profile">Profile</span>
            <span class="password">Password</span>
            <span class="socialProfile">Social Profile</span>
        </div>
        <div class="social-profile-title">Social Profile Link</div>
        <div class="social-profile-links">
            <div class="social-profile-link">
                <div class="social-name">
                    <i class="fa-brands fa-facebook-f"></i> 
                    <span>Facebook</span>
                </div>
                <input id="facebook" type="text" placeholder="https://facebook.com/username">
            </div>
            <div class="social-profile-link">
                <div class="social-name">
                    <i class="fa-brands fa-twitter"></i>
                    <span>Twitter</span>
                </div>
                <input id="twitter" type="text" placeholder="https://twitter.com/username">
            </div>
            <div class="social-profile-link">
                <div class="social-name">
                    <i class="fa-brands fa-linkedin-in"></i>
                    <span>Linkedin</span>
                </div>
                <input id="linkedin" type="text" placeholder="https://linkedin.com/username">
            </div>
            <div class="social-profile-link">
                <div class="social-name">
                    <i class="fa-solid fa-globe"></i>
                    <span>Website</span>
                </div>
                <input id="website" type="text" placeholder="https://example.com/username">
            </div>
            <div class="social-profile-link">
                <div class="social-name">
                    <i class="fa-brands fa-github"></i>
                    <span>Github</span>
                </div>
                <input id="github" type="text" placeholder="https://github.com/username">
            </div>
        </div>
    </section>
    
</body>
</html>
